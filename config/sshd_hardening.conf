# =====================================================================
#  /etc/ssh/sshd_config.d/00-pfc-hardening.conf
#  SSH real de administracion (PFC-Cowrie)
#
#  Se llama "00-" porque sshd usa el PRIMER valor que encuentra de cada
#  opcion: asi este fichero gana a 50-cloud-init.conf, 60-cloudimg...
# =====================================================================

# Puerto no estandar: el 22 queda para el honeypot
Port 2022

# Solo claves publicas, nunca contrasenas
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# Sin root y solo el usuario administrador (lo sustituye el script)
PermitRootLogin no
AllowUsers __ADMIN_USER__

# Limitar intentos y tiempo de login
MaxAuthTries 3
LoginGraceTime 30

# Funciones innecesarias desactivadas
X11Forwarding no
AllowAgentForwarding no
