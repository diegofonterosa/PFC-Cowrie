# =====================================================================
#  cowrie.cfg — Configuración del honeypot (PFC-Cowrie)
#  Proyecto Intermodular ASIR · Diego Pérez Fonterosa
#
#  Cowrie 3.x carga primero sus valores por defecto (cowrie.cfg.dist)
#  y después este fichero, así que aquí solo van las claves que cambian.
#  Ruta en el servidor: /home/cowrie/honeypot/etc/cowrie.cfg
# =====================================================================

[honeypot]
# Nombre de host del sistema falso. El valor por defecto (svr04) es una
# firma conocida de Cowrie que algunos bots usan para detectar honeypots.
hostname = web-prod-02

# Un único fichero JSON en vez de uno por día: simplifica el análisis
# con cowrie_analyzer.py durante el periodo de captura.
logtype = plain

# Las descargas de los atacantes se guardan (para extraer sus hashes)
# con un límite de tamaño para no llenar el disco.
download_limit_size = 10485760

# Sesiones inactivas se cierran a los 3 minutos.
interactive_timeout = 180

[shell]
# Identidad del sistema falso, coherente con el filesystem que trae
# Cowrie (Debian 12). Se cambian los valores por defecto, también
# conocidos como firma, por otros plausibles de un Debian actualizado.
kernel_version = 6.1.0-31-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.128-1 (2025-02-07)
hardware_platform = x86_64
operating_system = GNU/Linux
# x86_64 es la arquitectura que más malware recibe: maximiza capturas.
arch = linux-x64-lsb

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u5
# Cowrie escucha en 2222 (puerto sin privilegios). iptables redirige
# el tráfico del 22 público a este puerto.
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# Fuera de alcance del proyecto.
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
